 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liar's Dice Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase Compatibility Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700">
    <h1 class="text-3xl font-extrabold text-amber-400 text-center mb-6">🎲 Liar's Dice</h1>

    <!-- Debug Banner to verify script readiness -->
    <div id="debug-status" class="text-center text-xs text-amber-300 bg-amber-950/40 p-2 rounded mb-4 border border-amber-800/50">
      Initializing connection...
    </div>

    <!-- LOBBY SCREEN -->
    <div id="lobby-zone" class="space-y-4">
      <div>
        <label class="text-sm font-semibold text-slate-400">Your Name</label>
        <input type="text" id="playerName" placeholder="e.g. Alex" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-3 text-amber-400 font-bold focus:outline-none">
      </div>
      <div>
        <label class="text-sm font-semibold text-slate-400">Room Code</label>
        <input type="text" id="roomId" placeholder="e.g. 888" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-3 text-white font-bold focus:outline-none">
      </div>
      
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button id="btn-create" type="button" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3 rounded-lg shadow transition">Create Room</button>
        <button id="btn-join" type="button" class="bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-3 rounded-lg shadow transition">Join Room</button>
      </div>
    </div>

    <!-- GAME ROOM SCREEN -->
    <div id="game-zone" class="hidden space-y-4">
      <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 text-sm flex justify-between">
        <div>Room: <span id="disp-room" class="font-bold text-amber-400">--</span></div>
        <div>Role: <span id="disp-role" class="font-bold text-indigo-400">--</span></div>
      </div>

      <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
        <h3 class="text-xs font-semibold text-slate-400 uppercase mb-2">Players</h3>
        <div id="players-list" class="space-y-2"></div>
      </div>

      <div id="host-controls" class="hidden">
        <button id="btn-start" type="button" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3 rounded-lg">Start Game</button>
      </div>
      <div id="player-controls" class="hidden">
        <button id="btn-ready" type="button" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-3 rounded-lg">Ready Up</button>
      </div>

      <div id="active-game" class="hidden space-y-4">
        <div class="bg-slate-700/40 p-4 rounded-xl border border-slate-600 text-center">
          <div class="text-xs text-slate-400 mb-1">Your Dice</div>
          <div id="my-dice" class="flex justify-center gap-2 text-2xl font-bold text-amber-400">----</div>
        </div>
        <div id="bid-display" class="text-center text-sm font-bold text-amber-300">No Bids Yet</div>
      </div>
    </div>
  </div>

  <script>
    // 1. REPLACE WITH YOUR ACTUAL FIREBASE KEYS
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    let db;
    let myPlayerId = 'p_' + Math.random().toString(36).substr(2, 8);
    let myName = '', roomId = '', isHost = false;

    // Attach Event Listeners on DOM Load to avoid inline onclick failures
    window.addEventListener('DOMContentLoaded', () => {
      const statusEl = document.getElementById('debug-status');

      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
        statusEl.innerText = "Connected to Firebase SDK! Ready.";
        statusEl.className = "text-center text-xs text-emerald-400 bg-emerald-950/40 p-2 rounded mb-4 border border-emerald-800/50";
      } catch (e) {
        statusEl.innerText = "Firebase Init Failed: " + e.message;
        statusEl.className = "text-center text-xs text-rose-400 bg-rose-950/40 p-2 rounded mb-4 border border-rose-800/50";
        return;
      }

      document.getElementById('btn-create').addEventListener('click', createRoom);
      document.getElementById('btn-join').addEventListener('click', joinRoom);
    });

    function getInputs() {
      myName = document.getElementById('playerName').value.trim();
      roomId = document.getElementById('roomId').value.trim();
      if (!myName || !roomId) {
        alert("Please enter both Name and Room Code.");
        return false;
      }
      return true;
    }

    function createRoom() {
      if (!getInputs()) return;

      const roomRef = db.ref(`rooms/${roomId}`);
      roomRef.once('value', (snapshot) => {
        if (snapshot.exists()) {
          alert("Room code already taken. Try another code or click Join.");
          return;
        }

        isHost = true;
        const initialRoom = {
          hostId: myPlayerId,
          state: 'lobby',
          players: {
            [myPlayerId]: { name: myName, isReady: true, dice: [] }
          }
        };

        roomRef.set(initialRoom, (error) => {
          if (error) {
            alert("Database Error: " + error.message);
          } else {
            enterRoomUI();
          }
        });
      });
    }

    function joinRoom() {
      if (!getInputs()) return;

      const roomRef = db.ref(`rooms/${roomId}`);
      roomRef.once('value', (snapshot) => {
        if (!snapshot.exists()) {
          alert("Room does not exist. Click 'Create Room' first.");
          return;
        }

        isHost = false;
        db.ref(`rooms/${roomId}/players/${myPlayerId}`).set({
          name: myName,
          isReady: false,
          dice: []
        }, (error) => {
          if (error) {
            alert("Database Error: " + error.message);
          } else {
            enterRoomUI();
          }
        });
      });
    }

    function enterRoomUI() {
      document.getElementById('lobby-zone').classList.add('hidden');
      document.getElementById('game-zone').classList.remove('hidden');
      document.getElementById('disp-room').innerText = roomId;
      document.getElementById('disp-role').innerText = isHost ? "Host 👑" : "Player";

      db.ref(`rooms/${roomId}/players/${myPlayerId}`).onDisconnect().remove();

      db.ref(`rooms/${roomId}`).on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        const players = data.players || {};
        const pContainer = document.getElementById('players-list');
        pContainer.innerHTML = '';

        Object.keys(players).forEach(id => {
          const p = players[id];
          pContainer.innerHTML += `
            <div class="bg-slate-800 p-2 rounded border border-slate-700 flex justify-between text-xs">
              <span class="font-bold ${id === myPlayerId ? 'text-amber-400' : 'text-slate-200'}">${p.name} ${id === data.hostId ? '👑' : ''}</span>
              <span class="${p.isReady ? 'text-emerald-400' : 'text-rose-400'} font-bold">${p.isReady ? 'READY' : 'NOT READY'}</span>
            </div>
          `;
        });

        if (isHost) {
          document.getElementById('host-controls').classList.remove('hidden');
          document.getElementById('player-controls').classList.add('hidden');
        } else {
          document.getElementById('host-controls').classList.add('hidden');
          document.getElementById('player-controls').classList.remove('hidden');
        }
      });
    }
  </script>
</body>
</html>
