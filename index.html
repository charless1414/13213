<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liar's Dice Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700">
    <h1 class="text-3xl font-extrabold text-amber-400 text-center mb-6">🎲 Liar's Dice</h1>

    <!-- Connection Status Banner -->
    <div id="debug-status" class="text-center text-xs text-amber-300 bg-amber-950/40 p-2 rounded mb-4 border border-amber-800/50">
      Initializing SDK...
    </div>

    <!-- LOBBY ZONE -->
    <div id="lobby-zone" class="space-y-4">
      <div>
        <label class="text-sm font-semibold text-slate-400">Your Name</label>
        <input type="text" id="playerName" placeholder="e.g. Alex" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-3 text-amber-400 font-bold focus:outline-none" maxlength="24">
      </div>
      
      <button id="btn-create" type="button" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3 rounded-lg shadow transition">
        ➕ Create New Room
      </button>

      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-slate-700"></div>
        <span class="flex-shrink mx-4 text-xs text-slate-500 font-bold uppercase">Or Join Existing</span>
        <div class="flex-grow border-t border-slate-700"></div>
      </div>

      <div class="space-y-2">
        <input type="text" id="roomIdInput" placeholder="ENTER 6-DIGIT CODE" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white font-bold focus:outline-none uppercase tracking-widest" maxlength="6">
        <button id="btn-join" type="button" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-3 rounded-lg shadow transition">
          🚀 Join Room
        </button>
      </div>
    </div>

    <!-- ROOM / GAME ZONE -->
    <div id="game-zone" class="hidden space-y-4">
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center space-y-1">
        <div class="text-xs text-slate-400 uppercase font-semibold">Room Code</div>
        <div id="disp-room" class="text-3xl font-black text-amber-400 tracking-widest select-all">------</div>
        <div class="text-xs text-indigo-400 font-bold pt-1">Role: <span id="disp-role">--</span></div>
      </div>

      <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
        <div class="flex justify-between items-center mb-2">
          <h3 class="text-xs font-semibold text-slate-400 uppercase">Players in Room</h3>
          <span id="player-count" class="text-xs font-bold text-amber-400">(0)</span>
        </div>
        <div id="players-list" class="space-y-2"></div>
      </div>

      <!-- LOBBY CONTROLS -->
      <div id="host-controls" class="hidden">
        <button id="btn-start" type="button" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3 rounded-lg shadow">Start Game</button>
      </div>

      <!-- IN-GAME BOARD -->
      <div id="playing-field" class="hidden space-y-4 pt-2 border-t border-slate-700">
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center">
          <div class="text-xs text-slate-400 uppercase font-semibold mb-2">Your Secret Dice</div>
          <div id="my-dice" class="flex justify-center gap-2 text-2xl font-black text-amber-400">🎲 🎲 🎲 🎲 🎲</div>
        </div>

        <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700 text-center">
          <div class="text-xs text-slate-400 uppercase font-semibold">Current Bid</div>
          <div id="disp-bid" class="text-xl font-bold text-slate-200 mt-1">No bids yet</div>
          <div id="turn-indicator" class="text-xs font-bold text-amber-400 mt-2">-- Turn</div>
        </div>

        <div id="turn-actions" class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-400">Quantity</label>
              <select id="bid-qty" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-amber-400 font-bold">
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
              </select>
            </div>
            <div>
              <label class="text-xs text-slate-400">Face Value</label>
              <select id="bid-face" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-amber-400 font-bold">
                <option value="1">1s ⚀</option><option value="2">2s ⚁</option><option value="3">3s ⚂</option>
                <option value="4">4s ⚃</option><option value="5">5s ⚄</option><option value="6">6s ⚅</option>
              </select>
            </div>
          </div>
          <button id="btn-bid" type="button" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-2.5 rounded-lg">Place Bid</button>
          <button id="btn-liar" type="button" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-extrabold py-2.5 rounded-lg">Call Liar! 🤥</button>
        </div>

        <!-- Result / Round Info -->
        <div id="result-panel" class="hidden bg-slate-900/60 p-3 rounded-lg border border-slate-700 text-xs">
          <div id="result-text" class="font-bold text-amber-300"></div>
          <div id="reveal-dice" class="mt-2 text-slate-200"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    let db;
    let myPlayerId = localStorage.getItem('dice_pid') || ('p_' + Math.random().toString(36).substr(2, 8));
    localStorage.setItem('dice_pid', myPlayerId);

    let myName = '', currentRoomId = '', isHost = false;
    let currentRoomData = null;

    function makeCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 6; i++) { code += chars.charAt(Math.floor(Math.random() * chars.length)); }
      return code;
    }

    function rollDice() {
      return Array.from({length: 5}, () => Math.floor(Math.random() * 6) + 1);
    }

    // Clean active listener to prevent button freeze
    function detachCurrentRoomListener() {
      if (currentRoomId && db) {
        try { db.ref(`rooms/${currentRoomId}`).off(); } catch (e) { /* ignore */ }
      }
    }

    window.addEventListener('beforeunload', () => detachCurrentRoomListener());

    window.addEventListener('load', () => {
      const statusEl = document.getElementById('debug-status');
      if (typeof firebase === 'undefined') return;

      try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        statusEl.innerText = "GitHub Pages Connected to Firebase!";
        statusEl.className = "text-center text-xs text-emerald-400 bg-emerald-950/40 p-2 rounded mb-4 border border-emerald-800/50";
      } catch (err) {
        statusEl.innerText = "Config Error: " + err.message;
        return;
      }

      document.getElementById('btn-create').onclick = handleCreateRoom;
      document.getElementById('btn-join').onclick = handleJoinRoom;
      document.getElementById('btn-start').onclick = handleStartGame;
      document.getElementById('btn-bid').onclick = handlePlaceBid;
      document.getElementById('btn-liar').onclick = handleCallLiar;
    });

    function handleCreateRoom() {
      myName = document.getElementById('playerName').value.trim();
      const createBtn = document.getElementById('btn-create');
      createBtn.disabled = true;
      createBtn.innerText = "Creating...";

      if (!myName) {
        alert("Please enter your name!");
        createBtn.disabled = false;
        createBtn.innerText = "➕ Create New Room";
        return;
      }

      if (!db) {
        alert('Not connected to Firebase.');
        createBtn.disabled = false;
        createBtn.innerText = "➕ Create New Room";
        return;
      }

      detachCurrentRoomListener();

      isHost = true;

      const initialDataTemplate = () => ({
        hostId: myPlayerId,
        state: 'lobby',
        turn: myPlayerId,
        currentBid: null,
        playersOrder: [myPlayerId],
        players: {
          [myPlayerId]: { name: myName, dice: [] }
        }
      });

      // Try to create a unique 6-char room code using a transaction to avoid collisions
      function tryCreate(attemptsLeft) {
        const code = makeCode();
        const roomRef = db.ref(`rooms/${code}`);
        roomRef.transaction(room => {
          if (room) return; // already exists -> abort
          return initialDataTemplate();
        }, (err, committed, snapshot) => {
          if (err) {
            alert('Database Error: ' + err.message);
            createBtn.disabled = false;
            createBtn.innerText = "➕ Create New Room";
            return;
          }

          if (!committed) {
            // collision, try again (limited attempts)
            if (attemptsLeft > 0) return tryCreate(attemptsLeft - 1);
            alert('Unable to create room after multiple attempts. Please try again.');
            createBtn.disabled = false;
            createBtn.innerText = "➕ Create New Room";
            return;
          }

          // success
          currentRoomId = code;
          enterRoomUI();
          createBtn.disabled = false;
          createBtn.innerText = "➕ Create New Room";
        });
      }

      tryCreate(3);
    }

    function handleJoinRoom() {
      myName = document.getElementById('playerName').value.trim();
      currentRoomId = document.getElementById('roomIdInput').value.trim().toUpperCase();

      if (!myName || !currentRoomId) return alert("Enter name & room code!");

      const joinBtn = document.getElementById('btn-join');
      joinBtn.disabled = true;
      joinBtn.innerText = "Joining...";

      detachCurrentRoomListener();
      isHost = false;

      const roomRef = db.ref(`rooms/${currentRoomId}`);
      roomRef.transaction(room => {
        if (room === null) return; // abort
        if (room.state === 'playing') return; // don't allow join while playing
        room.players = room.players || {};
        if (!room.players[myPlayerId]) {
          room.players[myPlayerId] = { name: myName, dice: [] };
        }
        room.playersOrder = room.playersOrder || Object.keys(room.players);
        if (!room.playersOrder.includes(myPlayerId)) room.playersOrder.push(myPlayerId);
        return room;
      }, (err, committed, snapshot) => {
        joinBtn.disabled = false;
        joinBtn.innerText = "🚀 Join Room";

        if (err) {
          alert('Join Failed: ' + err.message);
          return;
        }

        if (!committed) {
          alert('Unable to join room. It may be in progress or not exist.');
          return;
        }

        enterRoomUI();
      });
    }

    function enterRoomUI() {
      document.getElementById('lobby-zone').classList.add('hidden');
      document.getElementById('game-zone').classList.remove('hidden');
      document.getElementById('disp-room').innerText = currentRoomId;
      document.getElementById('disp-role').innerText = isHost ? "Host 👑" : "Player";

      db.ref(`rooms/${currentRoomId}/players/${myPlayerId}`).onDisconnect().remove();

      db.ref(`rooms/${currentRoomId}`).on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        currentRoomData = data;

        const players = data.players || {};
        const playerKeys = data.playersOrder && data.playersOrder.length ? data.playersOrder : Object.keys(players);
        document.getElementById('player-count').innerText = `(${playerKeys.length})`;

        const pContainer = document.getElementById('players-list');
        pContainer.innerHTML = '';

        playerKeys.forEach(id => {
          const p = players[id] || { name: 'Unknown' };
          pContainer.innerHTML += `
            <div class="bg-slate-800 p-2.5 rounded-lg border border-slate-700 flex justify-between items-center text-xs">
              <span class="font-bold ${id === myPlayerId ? 'text-amber-400' : 'text-slate-200'}">
                ${p.name} ${id === data.hostId ? '👑' : ''} ${id === myPlayerId ? '(You)' : ''}
              </span>
              <span class="text-xs text-slate-400 font-semibold">${data.state === 'playing' ? '🎲 In Game' : 'In Lobby'}</span>
            </div>
          `;
        });

        if (isHost && data.state === 'lobby') {
          document.getElementById('host-controls').classList.remove('hidden');
        } else {
          document.getElementById('host-controls').classList.add('hidden');
        }

        // Playing UI
        if (data.state === 'playing') {
          document.getElementById('playing-field').classList.remove('hidden');

          const myData = players[myPlayerId];
          if (myData && myData.dice) {
            document.getElementById('my-dice').innerText = myData.dice.join('  ');
          } else {
            document.getElementById('my-dice').innerText = '🎲 🎲 🎲 🎲 🎲';
          }

          if (data.currentBid) {
            document.getElementById('disp-bid').innerText = `${data.currentBid.qty} × [ ${data.currentBid.face}s ] (by ${players[data.currentBid.by]?.name || 'Player'})`;
          } else {
            document.getElementById('disp-bid').innerText = "No bids yet";
          }

          const activePlayerName = players[data.turn]?.name || "Unknown";
          const isMyTurn = data.turn === myPlayerId;
          document.getElementById('turn-indicator').innerText = isMyTurn ? "👉 IT'S YOUR TURN!" : `Waiting for ${activePlayerName}...`;

          document.getElementById('turn-actions').style.opacity = isMyTurn ? "1" : "0.4";
          document.getElementById('btn-bid').disabled = !isMyTurn;
          document.getElementById('btn-liar').disabled = !isMyTurn || !data.currentBid;

          // hide result panel while in game
          document.getElementById('result-panel').classList.add('hidden');
        } else {
          document.getElementById('playing-field').classList.add('hidden');

          // If last round data exists, show it
          if (data.lastRound) {
            document.getElementById('result-panel').classList.remove('hidden');
            const lr = data.lastRound;
            const bidderName = (data.players && data.players[lr.bid.by] && data.players[lr.bid.by].name) || 'Player';
            const resultText = `${bidderName} bid ${lr.bid.qty} × [${lr.bid.face}s] — Matching dice: ${lr.totalMatching}. ${lr.success ? bidderName + ' was LYING!' : bidderName + ' was TELLING THE TRUTH!'}`;
            document.getElementById('result-text').innerText = resultText;

            // reveal dice
            let revealHtml = '';
            Object.keys(data.players || {}).forEach(pid => {
              const p = data.players[pid];
              revealHtml += `<div><strong>${p.name}:</strong> ${p.dice ? p.dice.join(' ') : '—'}</div>`;
            });
            document.getElementById('reveal-dice').innerHTML = revealHtml;
          } else {
            document.getElementById('result-panel').classList.add('hidden');
          }
        }
      });
    }

    function handleStartGame() {
      const roomRef = db.ref(`rooms/${currentRoomId}`);
      roomRef.transaction(room => {
        if (!room) return;
        const playerIds = room.playersOrder && room.playersOrder.length ? room.playersOrder : Object.keys(room.players || {});
        if (!playerIds || playerIds.length === 0) return;

        // Only host can start
        if (room.hostId !== myPlayerId) return;

        // assign dice and move to playing
        room.players = room.players || {};
        playerIds.forEach(id => {
          room.players[id] = room.players[id] || { name: 'Player', dice: [] };
          room.players[id].dice = Array.from({length:5}, () => Math.floor(Math.random()*6)+1);
        });

        room.state = 'playing';
        room.turn = playerIds[0];
        room.currentBid = null;
        room.lastRound = null; // clear previous round
        room.playersOrder = playerIds;
        return room;
      }, (err, committed, snapshot) => {
        if (err) return alert('Start Failed: ' + err.message);
        if (!committed) return alert('Could not start game (maybe already started or you are not host).');
      });
    }

    function isHigherBid(newBid, oldBid) {
      if (!oldBid) return true;
      if (newBid.qty > oldBid.qty) return true;
      if (newBid.qty === oldBid.qty && newBid.face > oldBid.face) return true;
      return false;
    }

    function handlePlaceBid() {
      const qty = parseInt(document.getElementById('bid-qty').value);
      const face = parseInt(document.getElementById('bid-face').value);
      const newBid = { qty, face, by: myPlayerId };

      const roomRef = db.ref(`rooms/${currentRoomId}`);
      roomRef.transaction(room => {
        if (!room) return;
        if (room.turn !== myPlayerId) return; // not your turn
        if (!isHigherBid(newBid, room.currentBid)) return; // invalid bid

        const order = room.playersOrder && room.playersOrder.length ? room.playersOrder : Object.keys(room.players || {});
        const idx = order.indexOf(myPlayerId);
        const nextPlayerId = order[(idx + 1) % order.length];

        room.currentBid = { qty, face, by: myPlayerId };
        room.turn = nextPlayerId;
        return room;
      }, (err, committed, snapshot) => {
        if (err) return alert('Bid failed: ' + err.message);
        if (!committed) return alert('Invalid bid or not your turn.');
      });
    }

    function handleCallLiar() {
      const roomRef = db.ref(`rooms/${currentRoomId}`);
      roomRef.transaction(room => {
        if (!room) return;
        const bid = room.currentBid;
        if (!bid) return; // nothing to call

        // Count matching dice (ones are wild)
        let totalMatching = 0;
        const players = room.players || {};
        Object.keys(players).forEach(id => {
          const dice = players[id].dice || [];
          dice.forEach(d => { if (d === bid.face || d === 1) totalMatching++; });
        });

        const success = totalMatching < bid.qty; // true if bidder was lying

        // store last round info so clients can render it
        room.lastRound = {
          bid: bid,
          totalMatching: totalMatching,
          success: success,
          resolvedAt: Date.now()
        };

        // Reset to lobby for next round; keep players (so dice are revealed via lastRound)
        room.state = 'lobby';
        room.currentBid = null;
        return room;
      }, (err, committed, snapshot) => {
        if (err) return alert('Call Liar failed: ' + err.message);
        if (!committed) return alert('Could not resolve liar (race condition).');
      });
    }
  </script>
</body>
</html>
