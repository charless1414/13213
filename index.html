<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>線上大話骰 Liar's Dice</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Small roll animation */
    .dice-roll {
      transform: translateY(-6px) rotate(-8deg);
      transition: transform 120ms ease;
    }
    .dice-final {
      transform: none;
      transition: transform 220ms ease;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 rounded-xl p-6 shadow-2xl text-center border border-slate-700" role="application" aria-label="大話骰遊戲介面">
    <h1 class="text-3xl font-bold text-amber-400 mb-6">🎲 線上大話骰</h1>

    <!-- 我的骰子 -->
    <div class="bg-slate-700/50 p-4 rounded-lg mb-6 border border-slate-600">
      <h2 class="text-sm font-semibold text-slate-400 mb-2">你的骰子</h2>
      <div id="dice-container" class="flex justify-center gap-2 text-3xl font-bold" aria-live="polite" aria-atomic="true">
        <!-- Dice elements inserted by JS -->
      </div>
      <div class="mt-4 flex gap-3 justify-center items-center">
        <button id="roll-btn" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2 px-6 rounded-full transition-all" aria-controls="dice-container">
          搖骰 (Roll)
        </button>
        <button id="randomize-seed" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 px-4 rounded-lg hidden" title="Debug">seed</button>
      </div>
    </div>

    <!-- 遊戲操作區 -->
    <div class="space-y-4 w-full">
      <div class="flex gap-2 justify-center items-center">
        <label for="count" class="sr-only">骰子數量</label>
        <input type="number" id="count" min="1" max="30" value="5" class="w-20 bg-slate-900 border border-slate-600 rounded p-2 text-center text-amber-400 font-bold" aria-label="骰子數量" />
        <span>個</span>
        <label for="point" class="sr-only">點數</label>
        <select id="point" class="bg-slate-900 border border-slate-600 rounded p-2 text-amber-400 font-bold" aria-label="叫牌點數">
          <option value="1">1 點</option>
          <option value="2">2 點</option>
          <option value="3">3 點</option>
          <option value="4">4 點</option>
          <option value="5">5 點</option>
          <option value="6">6 點</option>
        </select>
      </div>

      <div class="flex gap-3 justify-center">
        <button id="bid-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded-lg w-full">叫牌</button>
        <button id="reveal-btn" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-6 rounded-lg w-full">開！</button>
      </div>

      <div id="current-bid" class="mt-3 text-slate-300 text-sm" aria-live="polite"></div>
      <div id="result" class="mt-2 text-lg font-semibold"></div>
    </div>
  </div>

  <script>
    // Utility: secure random int 0..(max-1) using crypto when available
    function secureRandomInt(max) {
      if (window.crypto && crypto.getRandomValues) {
        // Generate a Uint32 and scale to [0, max)
        const range = Math.floor(0xFFFFFFFF / max) * max;
        let x;
        do {
          const arr = new Uint32Array(1);
          crypto.getRandomValues(arr);
          x = arr[0];
        } while (x >= range);
        return x % max;
      } else {
        return Math.floor(Math.random() * max);
      }
    }

    const diceContainer = document.getElementById('dice-container');
    const rollBtn = document.getElementById('roll-btn');
    const countInput = document.getElementById('count');
    const pointSelect = document.getElementById('point');
    const bidBtn = document.getElementById('bid-btn');
    const revealBtn = document.getElementById('reveal-btn');
    const currentBidEl = document.getElementById('current-bid');
    const resultEl = document.getElementById('result');

    const diceIcons = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
    let myDice = []; // holds current dice values [1..6]
    let currentBid = null;

    function renderDice(arr, animated = false) {
      diceContainer.innerHTML = '';
      arr.forEach((v, i) => {
        const span = document.createElement('span');
        span.className = 'bg-slate-800 p-2 rounded-lg border border-slate-600 text-amber-400 inline-flex items-center justify-center';
        span.style.minWidth = '2.2rem';
        span.style.minHeight = '2.2rem';
        span.setAttribute('role', 'img');
        span.setAttribute('aria-label', `骰子 ${i + 1}：${v} 點`);
        span.textContent = diceIcons[v - 1];
        if (animated) span.classList.add('dice-roll');
        diceContainer.appendChild(span);
      });
    }

    function animateRoll(finalValues, duration = 700) {
      // Show rapid changing icons for duration, then show final
      const start = Date.now();
      const interimCount = Math.max(10, finalValues.length);
      let animId = null;
      function tick() {
        const elapsed = Date.now() - start;
        if (elapsed >= duration) {
          renderDice(finalValues, false);
          return;
        }
        // set interim random faces
        const temp = [];
        for (let i = 0; i < finalValues.length; i++) {
          temp.push(secureRandomInt(6) + 1);
        }
        renderDice(temp, true);
        animId = requestAnimationFrame(tick);
      }
      tick();
    }

    function rollDice() {
      // ensure valid count
      let count = parseInt(countInput.value, 10) || 5;
      count = Math.max(1, Math.min(30, count));
      countInput.value = count;

      // disable UI while rolling
      rollBtn.disabled = true;
      bidBtn.disabled = true;
      revealBtn.disabled = true;
      resultEl.textContent = '';
      currentBidEl.textContent = '';

      // generate dice
      const values = [];
      for (let i = 0; i < count; i++) {
        const val = secureRandomInt(6) + 1; // 1..6
        values.push(val);
      }

      // animate and then set final
      animateRoll(values, 900);
      setTimeout(() => {
        myDice = values;
        renderDice(myDice, false);
        rollBtn.disabled = false;
        bidBtn.disabled = false;
        revealBtn.disabled = false;
        // expose in console for debugging
        console.log('rolled dice:', myDice);
        // announce final state for screen readers (aria-live already set on container)
      }, 920);
      return myDice;
    }

    rollBtn.addEventListener('click', () => {
      rollDice();
    });

    // Allow Enter on count field to trigger a roll
    countInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        rollBtn.click();
      }
    });

    // "叫牌" sets the current bid (client-side simple)
    bidBtn.addEventListener('click', () => {
      const count = Math.max(1, Math.min(30, parseInt(countInput.value, 10) || 1));
      const point = parseInt(pointSelect.value, 10);
      currentBid = { count, point };
      currentBidEl.textContent = `當前叫牌：${count} 個 ${point} 點`;
      resultEl.textContent = '';
    });

    // "開！" checks current player's dice against the bid (simple local check)
    revealBtn.addEventListener('click', () => {
      if (!currentBid) {
        resultEl.textContent = '請先叫牌 (按「叫牌")';
        resultEl.className = 'mt-2 text-lg font-semibold text-amber-300';
        return;
      }
      if (!myDice || myDice.length === 0) {
        resultEl.textContent = '請先搖骰 (按「搖骰")';
        resultEl.className = 'mt-2 text-lg font-semibold text-amber-300';
        return;
      }
      const matches = myDice.filter(v => v === currentBid.point).length;
      const success = matches >= currentBid.count;
      if (success) {
        resultEl.textContent = `結果：有 ${matches} 個 ${currentBid.point} 點，叫牌成立！`;
        resultEl.className = 'mt-2 text-lg font-semibold text-emerald-400';
      } else {
        resultEl.textContent = `結果：只有 ${matches} 個 ${currentBid.point} 點，叫牌失敗！`;
        resultEl.className = 'mt-2 text-lg font-semibold text-rose-400';
      }
    });

    // initial render with default dice
    document.addEventListener('DOMContentLoaded', () => {
      // ensure count input is in sync
      if (!countInput.value) countInput.value = 5;
      // initial placeholder dice
      const initial = Array.from({ length: parseInt(countInput.value, 10) || 5 }, () => 0);
      diceContainer.innerHTML = '';
      initial.forEach(() => {
        const span = document.createElement('span');
        span.className = 'bg-slate-800 p-2 rounded-lg border border-slate-600 text-slate-500 inline-flex items-center justify-center';
        span.style.minWidth = '2.2rem';
        span.style.minHeight = '2.2rem';
        span.textContent = '❓';
        diceContainer.appendChild(span);
      });
    });
  </script>
</body>
</html>
