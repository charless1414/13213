<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上多人大話骰 Liar's Dice</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-xl w-full bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700">
    <h1 class="text-3xl font-extrabold text-amber-400 text-center mb-6">🎲 線上多人大話骰</h1>

    <!-- 1. 登入/大廳區 -->
    <div id="lobby-zone" class="space-y-4">
      <div>
        <label class="text-sm font-semibold text-slate-400">玩家暱稱</label>
        <input type="text" id="playerName" placeholder="例如: 小明" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-3 text-amber-400 font-bold focus:outline-none focus:border-amber-400">
      </div>
      <div>
        <label class="text-sm font-semibold text-slate-400">房間號碼</label>
        <input type="text" id="roomId" placeholder="例如: 888" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-3 text-white font-bold focus:outline-none focus:border-amber-400">
      </div>
      <button onclick="joinRoom()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3 rounded-lg shadow-lg transition">加入 / 建立房間</button>
    </div>

    <!-- 2. 遊戲主畫面 (預設隱藏) -->
    <div id="game-zone" class="hidden space-y-6">
      
      <!-- 頂部資訊列 -->
      <div class="flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-700">
        <div>房號: <span id="disp-room" class="font-bold text-amber-400">--</span></div>
        <div>回合: <span id="disp-turn" class="font-bold text-emerald-400">等待開局...</span></div>
      </div>

      <!-- 桌面玩家區 (顯示所有人在場狀態) -->
      <div>
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">房內玩家</h3>
        <div id="players-list" class="grid grid-cols-2 gap-2"></div>
      </div>

      <!-- 當前叫牌訊息 -->
      <div class="bg-amber-500/10 border border-amber-500/30 p-4 rounded-xl text-center">
        <span class="text-xs text-amber-400/80 block uppercase font-bold">目前最新叫牌</span>
        <div id="current-bid-display" class="text-2xl font-black text-amber-400 mt-1">無叫牌</div>
      </div>

      <!-- 玩家自己的暗骰區 -->
      <div class="bg-slate-700/40 p-4 rounded-xl border border-slate-600/50 text-center">
        <div class="text-xs text-slate-400 font-semibold mb-2">你的骰子 (僅自己可見)</div>
        <div id="my-dice" class="flex justify-center gap-2 text-3xl font-extrabold my-2">----</div>
        <button onclick="rollMyDice()" id="btn-roll" class="bg-slate-600 hover:bg-slate-500 text-white text-xs py-1 px-4 rounded-full mt-2 transition">重搖我的骰子</button>
      </div>

      <!-- 操作面板 (喊點數 / 吹) -->
      <div class="space-y-3 bg-slate-900 p-4 rounded-xl border border-slate-700">
        <div class="flex items-center justify-center gap-3">
          <input type="number" id="bid-count" min="1" value="2" class="w-20 bg-slate-800 border border-slate-600 rounded-lg p-2 text-center text-amber-400 font-bold">
          <span>個</span>
          <select id="bid-point" class="bg-slate-800 border border-slate-600 rounded-lg p-2 text-amber-400 font-bold">
            <option value="1">1 點 (飛/通用)</option>
            <option value="2">2 點</option>
            <option value="3">3 點</option>
            <option value="4">4 點</option>
            <option value="5">5 點</option>
            <option value="6">6 點</option>
          </select>
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <button onclick="makeBid()" id="btn-bid" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition">喊牌 (Bid)</button>
          <button onclick="challenge()" id="btn-open" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-lg transition">開 / 抓吹牛！</button>
        </div>
      </div>

      <!-- 遊戲動態 Log -->
      <div id="game-log" class="bg-slate-950 p-3 rounded-lg h-28 overflow-y-auto text-xs text-slate-400 space-y-1 font-mono border border-slate-800"></div>

    </div>
  </div>

  <script>
    // ⚠️ 請填入你的 Firebase 配置 (登入 Firebase 主機版點選新增 Web 專案即可取得)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myPlayerId = 'p_' + Math.random().toString(36).substr(2, 9);
    let myName = '';
    let roomId = '';
    let myDice = [];
    const diceIcons = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

    function joinRoom() {
      myName = document.getElementById('playerName').value.trim();
      roomId = document.getElementById('roomId').value.trim();
      if (!myName || !roomId) return alert("請輸入暱稱與房號！");

      document.getElementById('lobby-zone').classList.add('hidden');
      document.getElementById('game-zone').classList.remove('hidden');
      document.getElementById('disp-room').innerText = roomId;

      // 1. 在 Firebase 建立玩家資料
      rollMyDice(false);
      db.ref(`rooms/${roomId}/players/${myPlayerId}`).set({
        name: myName,
        dice: myDice,
        joinedAt: Date.now()
      });

      // 玩家斷線自動移除
      db.ref(`rooms/${roomId}/players/${myPlayerId}`).onDisconnect().remove();

      // 2. 監聽房間所有狀態變化 (秒級同步的核心)
      db.ref(`rooms/${roomId}`).on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        updateRoomUI(data);
      });

      addLog(`玩家 [${myName}] 加入了房間。`);
    }

    function rollMyDice(updateDb = true) {
      myDice = Array.from({length: 5}, () => Math.floor(Math.random() * 6) + 1);
      document.getElementById('my-dice').innerHTML = myDice.map(d => 
        `<span class="bg-slate-800 px-2 py-1 rounded border border-slate-600 text-amber-400">${diceIcons[d-1]}</span>`
      ).join('');

      if (updateDb && roomId) {
        db.ref(`rooms/${roomId}/players/${myPlayerId}/dice`).set(myDice);
      }
    }

    function updateRoomUI(data) {
      const players = data.players || {};
      const playerIds = Object.keys(players);

      // 更新玩家清單
      const pContainer = document.getElementById('players-list');
      pContainer.innerHTML = '';
      playerIds.forEach(id => {
        const p = players[id];
        const isCurrentTurn = data.currentTurn === id;
        pContainer.innerHTML += `
          <div class="bg-slate-800 p-2 rounded border ${isCurrentTurn ? 'border-emerald-400 bg-emerald-950/20' : 'border-slate-700'} text-xs flex justify-between items-center">
            <span class="font-bold ${id === myPlayerId ? 'text-amber-400' : 'text-slate-200'}">${p.name} ${id === myPlayerId ? '(你)' : ''}</span>
            <span class="text-slate-500">${p.dice ? p.dice.length : 0} 骰</span>
          </div>
        `;
      });

      // 更新當前叫牌
      if (data.lastBid) {
        document.getElementById('current-bid-display').innerText = `${data.lastBid.count} 個 ${data.lastBid.point} 點 (${data.lastBid.by})`;
      } else {
        document.getElementById('current-bid-display').innerText = "無叫牌";
      }

      // 更新目前輪到誰
      if (data.currentTurn) {
        const turnName = players[data.currentTurn] ? players[data.currentTurn].name : '未知';
        document.getElementById('disp-turn').innerText = (data.currentTurn === myPlayerId) ? "👉 輪到你了！" : `輪到 ${turnName}`;
      }
    }

    function makeBid() {
      const count = parseInt(document.getElementById('bid-count').value);
      const point = parseInt(document.getElementById('bid-point').value);

      db.ref(`rooms/${roomId}`).transaction((room) => {
        if (!room) return room;
        room.lastBid = { count, point, by: myName, playerId: myPlayerId };
        
        // 自動切換到下一個人
        const pKeys = Object.keys(room.players || {});
        let nextIdx = (pKeys.indexOf(myPlayerId) + 1) % pKeys.length;
        room.currentTurn = pKeys[nextIdx];

        return room;
      });

      addLog(`[${myName}] 喊牌: ${count} 個 ${point} 點`);
    }

    function challenge() {
      db.ref(`rooms/${roomId}`).once('value', (snapshot) => {
        const data = snapshot.val();
        if (!data || !data.lastBid) return alert("目前還沒有人喊牌！");

        const targetPoint = data.lastBid.point;
        let totalMatches = 0;
        let showResults = [];

        // 統計所有人骰子（1 點算飛骰/狂野點數）
        Object.values(data.players || {}).forEach(p => {
          let pMatches = 0;
          (p.dice || []).forEach(d => {
            if (d === targetPoint || d === 1) pMatches++;
          });
          totalMatches += pMatches;
          showResults.push(`${p.name}: [${p.dice.join(',')}]`);
        });

        const win = totalMatches >= data.lastBid.count;
        const msg = `🔥 開牌！喊牌為 ${data.lastBid.count} 個 ${targetPoint} 點。\n實際總數(含1點): ${totalMatches} 個！\n\n開牌結果:\n${showResults.join('\n')}\n\n${win ? '吹牛失敗，喊牌者勝！' : '吹牛成功，開牌者勝！'}`;
        
        alert(msg);

        // 重置局面
        db.ref(`rooms/${roomId}/lastBid`).remove();
      });
    }

    function addLog(txt) {
      const logBox = document.getElementById('game-log');
      logBox.innerHTML += `<div>> ${txt}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }
  </script>
</body>
</html>
