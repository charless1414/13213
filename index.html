<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liar's Dice Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700">
    <h1 class="text-3xl font-extrabold text-amber-400 text-center mb-6">🎲 Liar's Dice</h1>

    <!-- Connection Status Banner -->
    <div id="debug-status" class="text-center text-xs text-amber-300 bg-amber-950/40 p-2 rounded mb-4 border border-amber-800/50">
      Connecting to Firebase...
    </div>

    <!-- LOBBY ZONE -->
    <div id="lobby-zone" class="space-y-4">
      <div>
        <label class="text-sm font-semibold text-slate-400">Your Name</label>
        <input type="text" id="playerName" placeholder="e.g. Alex" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-3 text-amber-400 font-bold focus:outline-none">
      </div>
      
      <!-- Option 1: Create New Room (Auto-code) -->
      <button id="btn-create" type="button" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3 rounded-lg shadow transition">
        ➕ Create New Room
      </button>

      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-slate-700"></div>
        <span class="flex-shrink mx-4 text-xs text-slate-500 font-bold uppercase">Or Join Existing</span>
        <div class="flex-grow border-t border-slate-700"></div>
      </div>

      <!-- Option 2: Join Existing Room -->
      <div class="space-y-2">
        <input type="text" id="roomIdInput" placeholder="Enter Room Code (e.g. A8K2P9)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white font-bold focus:outline-none uppercase tracking-widest text-center">
        <button id="btn-join" type="button" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-3 rounded-lg shadow transition">
          🚀 Join Room
        </button>
      </div>
    </div>

    <!-- GAME ROOM ZONE -->
    <div id="game-zone" class="hidden space-y-4">
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center space-y-1">
        <div class="text-xs text-slate-400 uppercase font-semibold">Room Code</div>
        <div id="disp-room" class="text-3xl font-black text-amber-400 tracking-widest select-all">------</div>
        <div class="text-xs text-indigo-400 font-bold pt-1">Role: <span id="disp-role">--</span></div>
      </div>

      <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
        <h3 class="text-xs font-semibold text-slate-400 uppercase mb-2">Players in Room</h3>
        <div id="players-list" class="space-y-2"></div>
      </div>

      <div id="host-controls" class="hidden">
        <button id="btn-start" type="button" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3 rounded-lg">Start Game</button>
      </div>
      <div id="player-controls" class="hidden">
        <button id="btn-ready" type="button" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-3 rounded-lg">Ready Up</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ REPLACE WITH YOUR REAL FIREBASE KEYS
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    let db;
    let myPlayerId = 'p_' + Math.random().toString(36).substr(2, 8);
    let myName = '', currentRoomId = '', isHost = false;

    // Generate random 6-character uppercase room code
    function generateRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // Excludes confusing characters like 0, O, 1, I
      let result = '';
      for (let i = 0; i < 6; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const statusEl = document.getElementById('debug-status');

      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
        statusEl.innerText = "Connected to Firebase SDK! Ready.";
        statusEl.className = "text-center text-xs text-emerald-400 bg-emerald-950/40 p-2 rounded mb-4 border border-emerald-800/50";
      } catch (e) {
        statusEl.innerText = "Firebase Init Failed: " + e.message;
        statusEl.className = "text-center text-xs text-rose-400 bg-rose-950/40 p-2 rounded mb-4 border border-rose-800/50";
        return;
      }

      document.getElementById('btn-create').addEventListener('click', createRoom);
      document.getElementById('btn-join').addEventListener('click', joinRoom);
    });

    function createRoom() {
      myName = document.getElementById('playerName').value.trim();
      if (!myName) {
        alert("Please enter your name first.");
        return;
      }

      currentRoomId = generateRoomCode();
      const roomRef = db.ref(`rooms/${currentRoomId}`);

      isHost = true;
      const initialRoom = {
        hostId: myPlayerId,
        state: 'lobby',
        players: {
          [myPlayerId]: { name: myName, isReady: true, dice: [] }
        }
      };

      roomRef.set(initialRoom, (error) => {
        if (error) {
          alert("Database Error: " + error.message);
        } else {
          enterRoomUI();
        }
      });
    }

    function joinRoom() {
      myName = document.getElementById('playerName').value.trim();
      currentRoomId = document.getElementById('roomIdInput').value.trim().toUpperCase();

      if (!myName) return alert("Please enter your name.");
      if (!currentRoomId) return alert("Please enter a room code to join.");

      const roomRef = db.ref(`rooms/${currentRoomId}`);
      roomRef.once('value', (snapshot) => {
        if (!snapshot.exists()) {
          alert("Room code not found! Please double check the code.");
          return;
        }

        isHost = false;
        db.ref(`rooms/${currentRoomId}/players/${myPlayerId}`).set({
          name: myName,
          isReady: false,
          dice: []
        }, (error) => {
          if (error) {
            alert("Database Error: " + error.message);
          } else {
            enterRoomUI();
          }
        });
      });
    }

    function enterRoomUI() {
      document.getElementById('lobby-zone').classList.add('hidden');
      document.getElementById('game-zone').classList.remove('hidden');
      document.getElementById('disp-room').innerText = currentRoomId;
      document.getElementById('disp-role').innerText = isHost ? "Host 👑" : "Player";

      // Disconnect cleanup
      db.ref(`rooms/${currentRoomId}/players/${myPlayerId}`).onDisconnect().remove();

      // Listen for room updates
      db.ref(`rooms/${currentRoomId}`).on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        const players = data.players || {};
        const pContainer = document.getElementById('players-list');
        pContainer.innerHTML = '';

        Object.keys(players).forEach(id => {
          const p = players[id];
          pContainer.innerHTML += `
            <div class="bg-slate-800 p-2.5 rounded-lg border border-slate-700 flex justify-between items-center text-xs">
              <span class="font-bold ${id === myPlayerId ? 'text-amber-400' : 'text-slate-200'}">${p.name} ${id === data.hostId ? '👑' : ''}</span>
              <span class="${p.isReady ? 'text-emerald-400' : 'text-rose-400'} font-bold">${p.isReady ? 'READY' : 'NOT READY'}</span>
            </div>
          `;
        });

        if (isHost) {
          document.getElementById('host-controls').classList.remove('hidden');
          document.getElementById('player-controls').classList.add('hidden');
        } else {
          document.getElementById('host-controls').classList.add('hidden');
          document.getElementById('player-controls').classList.remove('hidden');
        }
      });
    }
  </script>
</body>
</html>
